name: daily_backup
destinations:
- type: ssh
  config:
    user: ""
    ip: ""
    port: 22
    key_path: ""
    remote_directory: ""
- type: telegram
  config:
    chat_id: 0
    bot_keypath: ""
targets:
- type: file
  config:
    type: normal
    config:
      path: /some/path/to/file
- type: file
  config:
    type: container
    config:
      container_name: test_file_container
      stop_on_backup: true
      path: /some/path/to/file/inside/container
- type: postgres
  config:
    type: normal
    config: {}
- type: postgres
  config:
    type: container
    config:
      container_name: test_postgres_container
      stop_on_backup: true
cron: 0 0 * * *
include: true
